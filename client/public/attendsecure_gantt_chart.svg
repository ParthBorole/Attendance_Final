<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#111827" font-family="Georgia, serif">
    Gantt Chart for AttendSecure Project (Sep 2026 – Dec 2026)
  </text>

  <!-- Definitions for Gradients & Drop Shadow -->
  <defs>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Chart Area Coordinates -->
  <!-- Left Margin: 240, Right Margin: 1140 (Width 900) -->
  <!-- Top Margin: 80, Bottom Margin: 580 (Height 500) -->
  
  <!-- Vertical Grid Lines (Dates: Sep 01 to Dec 31 -> Total 122 days) -->
  <!-- 0: Sep 01 (x=240) -->
  <!-- 14: Sep 15 (x=343) -->
  <!-- 30: Oct 01 (x=461) -->
  <!-- 44: Oct 15 (x=564) -->
  <!-- 61: Nov 01 (x=689) -->
  <!-- 75: Nov 15 (x=792) -->
  <!-- 91: Dec 01 (x=910) -->
  <!-- 105: Dec 15 (x=1013) -->
  <!-- 121: Dec 31 (x=1131) -->

  <!-- Grid lines -->
  <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3">
    <line x1="240" y1="80" x2="240" y2="580" />
    <line x1="343" y1="80" x2="343" y2="580" />
    <line x1="461" y1="80" x2="461" y2="580" />
    <line x1="564" y1="80" x2="564" y2="580" />
    <line x1="689" y1="80" x2="689" y2="580" />
    <line x1="792" y1="80" x2="792" y2="580" />
    <line x1="910" y1="80" x2="910" y2="580" />
    <line x1="1013" y1="80" x2="1013" y2="580" />
    <line x1="1131" y1="80" x2="1131" y2="580" />

    <!-- Horizontal Task guide lines -->
    <line x1="240" y1="115" x2="1131" y2="115" />
    <line x1="240" y1="165" x2="1131" y2="165" />
    <line x1="240" y1="215" x2="1131" y2="215" />
    <line x1="240" y1="265" x2="1131" y2="265" />
    <line x1="240" y1="315" x2="1131" y2="315" />
    <line x1="240" y1="365" x2="1131" y2="365" />
    <line x1="240" y1="415" x2="1131" y2="415" />
    <line x1="240" y1="465" x2="1131" y2="465" />
    <line x1="240" y1="515" x2="1131" y2="515" />
    <line x1="240" y1="565" x2="1131" y2="565" />
  </g>

  <!-- Y-Axis Main Line -->
  <line x1="240" y1="80" x2="240" y2="580" stroke="#1f2937" stroke-width="2" />
  <!-- X-Axis Main Line -->
  <line x1="240" y1="580" x2="1131" y2="580" stroke="#1f2937" stroke-width="2" />

  <!-- Y-Axis Label -->
  <text x="35" y="330" transform="rotate(-90 35 330)" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">
    Tasks
  </text>

  <!-- Task Names (Y-Axis) -->
  <g font-size="13.5" font-weight="500" fill="#1f2937" text-anchor="end">
    <text x="225" y="120">Final Documentation</text>
    <text x="225" y="170">Deployment</text>
    <text x="225" y="220">Testing</text>
    <text x="225" y="270">Database Integration</text>
    <text x="225" y="320">Backend Development</text>
    <text x="225" y="370">Frontend Development</text>
    <text x="225" y="420">UI/UX Design</text>
    <text x="225" y="470">System Design</text>
    <text x="225" y="520">Requirement Analysis</text>
    <text x="225" y="570">Project Planning</text>
  </g>

  <!-- Gantt Horizontal Bars (Vibrant, clear with rounded corners and border) -->
  <g stroke="#1f2937" stroke-width="1.2" filter="url(#shadow)" rx="3" ry="3">
    <!-- 10. Final Documentation (Dec 05 - Dec 22) -->
    <rect x="940" y="102" width="105" height="26" fill="#f43f5e" rx="3" />
    <!-- 9. Deployment (Nov 26 - Dec 10) -->
    <rect x="880" y="152" width="95" height="26" fill="#eab308" rx="3" />
    <!-- 8. Testing (Nov 15 - Dec 02) -->
    <rect x="792" y="202" width="118" height="26" fill="#22c55e" rx="3" />
    <!-- 7. Database Integration (Nov 01 - Nov 18) -->
    <rect x="689" y="252" width="115" height="26" fill="#14b8a6" rx="3" />
    <!-- 6. Backend Development (Oct 12 - Nov 08) -->
    <rect x="542" y="302" width="180" height="26" fill="#0ea5e9" rx="3" />
    <!-- 5. Frontend Development (Oct 02 - Oct 28) -->
    <rect x="468" y="352" width="170" height="26" fill="#3b82f6" rx="3" />
    <!-- 4. UI/UX Design (Sep 22 - Oct 08) -->
    <rect x="395" y="402" width="110" height="26" fill="#8b5cf6" rx="3" />
    <!-- 3. System Design (Sep 14 - Sep 28) -->
    <rect x="335" y="452" width="100" height="26" fill="#a855f7" rx="3" />
    <!-- 2. Requirement Analysis (Sep 06 - Sep 20) -->
    <rect x="277" y="502" width="98" height="26" fill="#ec4899" rx="3" />
    <!-- 1. Project Planning (Sep 01 - Sep 12) -->
    <rect x="240" y="552" width="80" height="26" fill="#f97316" rx="3" />
  </g>

  <!-- Tick Marks on X-Axis -->
  <g stroke="#1f2937" stroke-width="1.5">
    <line x1="240" y1="580" x2="240" y2="588" />
    <line x1="343" y1="580" x2="343" y2="588" />
    <line x1="461" y1="580" x2="461" y2="588" />
    <line x1="564" y1="580" x2="564" y2="588" />
    <line x1="689" y1="580" x2="689" y2="588" />
    <line x1="792" y1="580" x2="792" y2="588" />
    <line x1="910" y1="580" x2="910" y2="588" />
    <line x1="1013" y1="580" x2="1013" y2="588" />
    <line x1="1131" y1="580" x2="1131" y2="588" />
  </g>

  <!-- Tick Marks on Y-Axis -->
  <g stroke="#1f2937" stroke-width="1.5">
    <line x1="234" y1="115" x2="240" y2="115" />
    <line x1="234" y1="165" x2="240" y2="165" />
    <line x1="234" y1="215" x2="240" y2="215" />
    <line x1="234" y1="265" x2="240" y2="265" />
    <line x1="234" y1="315" x2="240" y2="315" />
    <line x1="234" y1="365" x2="240" y2="365" />
    <line x1="234" y1="415" x2="240" y2="415" />
    <line x1="234" y1="465" x2="240" y2="465" />
    <line x1="234" y1="515" x2="240" y2="515" />
    <line x1="234" y1="565" x2="240" y2="565" />
  </g>

  <!-- X-Axis Labels (Dates rotated slightly for readability) -->
  <g font-size="13" font-weight="500" fill="#1f2937" text-anchor="end">
    <text x="240" y="605" transform="rotate(-35 240 605)">Sep 01</text>
    <text x="343" y="605" transform="rotate(-35 343 605)">Sep 15</text>
    <text x="461" y="605" transform="rotate(-35 461 605)">Oct 01</text>
    <text x="564" y="605" transform="rotate(-35 564 605)">Oct 15</text>
    <text x="689" y="605" transform="rotate(-35 689 605)">Nov 01</text>
    <text x="792" y="605" transform="rotate(-35 792 605)">Nov 15</text>
    <text x="910" y="605" transform="rotate(-35 910 605)">Dec 01</text>
    <text x="1013" y="605" transform="rotate(-35 1013 605)">Dec 15</text>
    <text x="1131" y="605" transform="rotate(-35 1131 605)">Dec 31</text>
  </g>

  <!-- X-Axis Label -->
  <text x="685" y="660" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">
    Timeline
  </text>
</svg>
