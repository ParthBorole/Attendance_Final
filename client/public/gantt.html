<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gantt Chart - AttendSecure Project</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 1240px;
      width: 100%;
      text-align: center;
    }
    .btn {
      margin-top: 20px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #0f172a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #334155;
    }
    img, svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/attendsecure_gantt_chart.svg" alt="Gantt Chart for AttendSecure Project" />
    <br>
    <a href="/attendsecure_gantt_chart.svg" download="AttendSecure_Gantt_Chart.svg" class="btn">
      📥 Download Vector Chart (For Word Report)
    </a>
  </div>
</body>
</html>
